services:
  web:
    image: nginx:bookworm
    container_name: home_cloud
    ports:
      - "8080:80"
    volumes:
      - ./src/:/var/www/html/
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /srv/cloud/data/:/srv/cloud/data/
    depends_on:
      - php

  php:
    build: .
    image: home_cloud
    volumes:
      - ./src:/var/www/html
      - /srv/cloud/users/:/srv/cloud/users/
      - /srv/cloud/data/:/srv/cloud/data/